<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Polling Engine</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 600px;
            margin-bottom: 30px;
        }
        h2, h3 {
            color: #1e3a8a;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4b5563;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .option-input {
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .poll-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .vote-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            margin-left: 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .vote-btn:hover {
            background-color: #059669;
        }
        .option-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 8px;
            background: #f9fafb;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Create a Live Poll</h2>
        
        <div class="form-group">
            <label for="pollQuestion">Poll Question / Title</label>
            <input type="text" id="pollQuestion" placeholder="e.g., Which language do you prefer?">
        </div>

        <div class="form-group">
            <label>Options</label>
            <input type="text" class="option-field option-input" placeholder="Option 1">
            <input type="text" class="option-field option-input" placeholder="Option 2">
            <input type="text" class="option-field option-input" placeholder="Option 3">
        </div>

        <button onclick="deployPoll()">Deploy Poll</button>
    </div>

    <div class="container" style="max-width: 600px; background: transparent; box-shadow: none; padding: 0;">
        <h3>Active Live Polls</h3>
        <div id="pollsContainer"></div>
    </div>

    <script>
        // Array to hold active state directly inside local storage sandbox
        let localPolls = [];

        // Direct memory action handler - bypassing socket blocks completely
        function deployPoll() {
            const questionField = document.getElementById('pollQuestion');
            const question = questionField.value.trim();
            
            const optionFields = document.querySelectorAll('.option-field');
            let optionsObj = {};
            let count = 0;
            
            optionFields.forEach(field => {
                if (field.value.trim() !== "") {
                    optionsObj[field.value.trim()] = 0;
                    count++;
                }
            });

            if (!question || count < 2) {
                alert("Please enter a question and at least 2 options.");
                return;
            }

            const newPoll = {
                id: 'poll_' + Date.now(),
                question: question,
                options: optionsObj
            };

            localPolls.unshift(newPoll);
            renderPolls();

            // Resetting input fields smoothly
            questionField.value = "";
            optionFields.forEach(field => field.value = "");
        }

        function castVote(pollId, optionName) {
            localPolls.forEach(poll => {
                if (poll.id === pollId) {
                    poll.options[optionName] = (poll.options[optionName] || 0) + 1;
                }
            });
            renderPolls();
        }

        function renderPolls() {
            const container = document.getElementById('pollsContainer');
            container.innerHTML = "";
            
            localPolls.forEach(poll => {
                let optionsHtml = '';
                for (const option in poll.options) {
                    optionsHtml += `
                        <div class="option-row">
                            <span>${option} (<b>${poll.options[option]}</b> votes)</span>
                            <button class="vote-btn" onclick="castVote('${poll.id}', '${option}')">Vote</button>
                        </div>
                    `;
                }

                const pollCard = document.createElement('div');
                pollCard.className = 'poll-card';
                pollCard.innerHTML = `
                    <h4>📌 ${poll.question}</h4>
                    <div class="options-list">${optionsHtml}</div>
                `;
                container.appendChild(pollCard);
            });
        }
    </script>
</body>
</html>
